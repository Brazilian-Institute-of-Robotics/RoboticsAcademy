{% extends "base.html" %}
{% load render_bundle from webpack_loader %}

{% block content %}
  {% csrf_token %}
  <div id="password-reset-confirm-root"></div>
  <script>
    window.PASSWORD_RESET = JSON.parse('{{ password_reset_json|escapejs }}');
  </script>
{% endblock %}

{% block before_end_body %}
    {{ block.super }}
    {% render_bundle 'password_reset_confirm' 'js' %}
{% endblock %}
