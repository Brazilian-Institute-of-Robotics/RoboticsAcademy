services:
  my-postgres:
    image: rasc_academy_db:latest
    container_name: universe_db
    environment:
      POSTGRES_DB: academy_db
      POSTGRES_USER: user-dev
      POSTGRES_PASSWORD: robotics-academy-dev
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -U user-dev -d academy_db
      interval: 3s
      timeout: 1s
      retries: 20

  robotics-academy-webapp:
      image: jderobot/robotics-academy:test
      container_name: developer-webapp
      entrypoint: /RoboticsAcademy/scripts/RADI/entrypoints/webapp_dev.sh
      ports:
        - "7164:7164"
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
      tty: true
      stdin_open: true
      environment:
        DOCKER_HOST: "unix:///var/run/docker.sock"
        DB_NAME: academy_db
        DB_USER: user-dev
        DB_PASSWORD: robotics-academy-dev
        DB_HOST: my-postgres
        DB_PORT: 5432
        GPU_NVIDIA_AVAILABLE: 1
      depends_on:
        my-postgres:
          condition: service_healthy
        
