networks:
  user-network:
    driver: bridge

services:
  my-postgres:
    image: jderobot/robotics-database:latest
    container_name: universe_db_prod
    env_file: .env 
    environment:
      POSTGRES_DB: ${DB_NAME} 
      POSTGRES_USER: ${DB_USER} 
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./RoboticsInfrastructure/database/universes.sql:/docker-entrypoint-initdb.d/1.sql
      - ./database/exercises/db.sql:/docker-entrypoint-initdb.d/2.sql
      - ./database/django_auth.sql:/docker-entrypoint-initdb.d/3.sql
      - ./scripts:/scripts
    networks:
        - user-network
    healthcheck:
      test: pg_isready -U ${DB_USER} -d ${DB_NAME}
      interval: 3s
      timeout: 1s
      retries: 20

  robotics-academy-webapp-prod:
      image: jderobot/robotics-academy:test
      container_name: production-webapp
      entrypoint: ./entrypoint_prod.sh
      ports:
        - "8000:8000"
      volumes:
        - type: bind
          source: ./
          target: /RoboticsAcademy
        - type: bind
          source: ./staticfiles
          target: /RoboticsAcademy/staticfiles
        - type: bind
          source: ./student_codes
          target: /RoboticsAcademy/student_codes
        - /var/run/docker.sock:/var/run/docker.sock
      networks:
        - user-network
      tty: true
      stdin_open: true
      environment:
        DOCKER_HOST: "unix:///var/run/docker.sock"
      depends_on:
        my-postgres:
          condition: service_healthy
        
  nginx:
    image: nginx:latest
    env_file: .env 
    ports:
      - "${SERVER_PORT}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/RoboticsAcademy/staticfiles
      - ./ssl:/etc/nginx/ssl
    networks:
        - user-network
    depends_on:
      - robotics-academy-webapp-prod