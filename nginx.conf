map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_cookie $user_id {
    default "";
    ~user_id=(\d+) $1;
}

server {
    listen 443 ssl;
    server_name 127.0.0.1;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    #GUNICORN SERVER frontend
    location / {
        proxy_pass http://robotics-academy-webapp:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    #MANAGER
    location ~ ^/ws/user/(?<user_id>\d+)/?$ {
        resolver 127.0.0.11;
        proxy_pass http://manager_container_user_$user_id:7163;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    #GAZEBO
    location ~ ^/gazebo/user/(?<user_id>\d+)(/(?<path>.*))?$ {
        resolver 127.0.0.11;

        # Reescreve a URL para tirar o prefixo /gazebo/user/<id>
        rewrite ^/gazebo/user/\d+(/.*)?$ $1 break;

        proxy_pass http://manager_container_user_$user_id:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    
    #CONSOLE
    location ~ ^/console/user/(?<user_id>\d+)(/(?<path>.*))?$ {
        resolver 127.0.0.11;

        # Reescreve a URL para tirar o prefixo /console/user/<id>
        rewrite ^/console/user/\d+(/.*)?$ $1 break;

        proxy_pass http://manager_container_user_$user_id:1108;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    location = /websockify {
        resolver 127.0.0.11;

        proxy_pass http://manager_container_user_$user_id:7164/websockify;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }



    location /static/ {
        alias /RoboticsAcademy/staticfiles/;
    }

    location /media/ {
        alias /RoboticsAcademy/media/;
    }
}
